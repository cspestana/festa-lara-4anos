<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festa da Lara, 4 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Baloo 2', system-ui, sans-serif;
    color: #1d1f4e;
    background: #1d1f4e url('fundo.png') center top / cover no-repeat fixed;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 14px 40px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 28px;
    padding: 24px 22px 26px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  h1 {
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    color: #d6246e;
    font-size: 1.6rem;
    line-height: 1.3;
    margin: 0 0 6px;
    text-align: center;
  }
  .data {
    text-align: center;
    background: #1d1f4e;
    color: #fff;
    border-radius: 16px;
    padding: 10px 12px;
    font-size: 1rem;
    line-height: 1.4;
    margin: 14px 0 16px;
  }
  .sub {
    font-size: 1.2rem;
    font-weight: 800;
    color: #d6246e;
    margin: 4px 0 2px;
  }
  .convite {
    font-size: 1rem;
    color: #1d1f4e;
    margin: 0 0 14px;
  }
  h2 {
    font-size: 1.1rem;
    font-weight: 800;
    color: #1d1f4e;
    margin: 18px 0 8px;
  }
  label.campo {
    display: block;
    font-weight: 700;
    font-size: 1rem;
    margin: 10px 0 6px;
    color: #1d1f4e;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 1rem;
    border: 2px solid #f0c6dc;
    border-radius: 14px;
    margin-bottom: 8px;
    background: #fff;
    color: #1d1f4e;
  }
  input[type=text]:focus {
    outline: none;
    border-color: #d6246e;
  }
  input[type=text]:disabled { background: #f2f2f2; }
  .nao {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 8px;
    padding: 12px 14px;
    border-radius: 14px;
    background: #fff0f7;
    color: #8a1d4d;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  input[type=checkbox] { transform: scale(1.4); margin: 0; }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    background: #d6246e;
    color: #fff;
    border: 0;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
  }
  button:disabled { background: #aaa; }
  #aviso {
    display: none;
    text-align: center;
    padding: 20px 16px;
    border-radius: 16px;
  }
  #aviso h3 { margin: 0 0 8px; font-size: 1.6rem; font-weight: 800; }
  #aviso h4 { margin: 0 0 10px; font-size: 1.25rem; font-weight: 800; }
  #aviso p { margin: 0; font-size: 1rem; line-height: 1.5; }
  #aviso.sim { background: #e8f7ec; }
  #aviso.sim h3 { color: #1d1f4e; }
  #aviso.sim h4 { color: #1d6b33; }
  #aviso.sim p { color: #333; font-weight: 600; }
  #aviso.nao { background: #fde8f1; }
  #aviso.nao h3 { color: #d6246e; }
  #aviso.nao h4 { color: #2a2350; }
  #aviso.nao p { color: #444; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <h1>A pequena super-heroína Lara vai completar 4 anos! 🕷️</h1>

  <div class="data">
    <strong>Sábado, 13 de fevereiro, às 13h</strong><br>
    Av. Nova Iorque, 168, Utinga, Santo André/SP
  </div>

  <div class="sub">💗 E aí, vamos embarcar nessa aventura?</div>
  <p class="convite">Para organizar nossa missão, confirme sua presença:</p>

  <form id="form">
    <h2>🎉 Pode contar com a gente!</h2>

    <label class="campo">👨‍👩‍👧 Adultos</label>
    <input type="text" id="ad1" placeholder="Nome do adulto">
    <input type="text" id="ad2" placeholder="Nome do adulto">

    <label class="campo">🧒 Pequenos aventureiros</label>
    <input type="text" id="cr1" placeholder="Nome da criança">
    <input type="text" id="cr2" placeholder="Nome da criança">

    <label class="nao">
      <input type="checkbox" id="naoVao">
      😢 Dessa vez não vamos conseguir participar
    </label>

    <button type="submit" id="enviar">Enviar</button>
  </form>

  <div id="aviso"></div>
</div>

<script>
// Endereço do Apps Script (planilha)
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxqx6kydxA-5hnIWTLZR4If7PaJILITX8n4y5-1ffQwIhKBKZqLkblNtzkTCzPBxW8MsQ/exec';

const form = document.getElementById('form');
const naoVao = document.getElementById('naoVao');
const enviar = document.getElementById('enviar');
const aviso = document.getElementById('aviso');
const nomes = ['ad1', 'ad2', 'cr1', 'cr2'].map(id => document.getElementById(id));

// "Não vamos" limpa os nomes, e digitar um nome desmarca "Não vamos"
naoVao.addEventListener('change', () => {
  if (naoVao.checked) nomes.forEach(i => { i.value = ''; i.disabled = true; });
  else nomes.forEach(i => i.disabled = false);
});
nomes.forEach(i => i.addEventListener('input', () => {
  if (i.value.trim() !== '') naoVao.checked = false;
  nomes.forEach(j => j.disabled = false);
}));

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (URL_SCRIPT.includes('COLE_AQUI')) {
    alert('Página sem o endereço da planilha configurado.');
    return;
  }
  const adultos = [nomes[0], nomes[1]].map(i => i.value.trim()).filter(v => v);
  const criancas = [nomes[2], nomes[3]].map(i => i.value.trim()).filter(v => v);
  if (!naoVao.checked && adultos.length + criancas.length === 0) {
    alert('Escreva o nome de quem vem, ou marque "Dessa vez não vamos conseguir participar".');
    return;
  }

  const dados = {
    adultos: naoVao.checked ? [] : adultos,
    criancas: naoVao.checked ? [] : criancas,
    naoVao: naoVao.checked
  };

  enviar.disabled = true;
  enviar.textContent = 'Enviando...';
  await fetch(URL_SCRIPT, {
    method: 'POST',
    mode: 'no-cors',
    body: new URLSearchParams({ dados: JSON.stringify(dados) })
  });

  form.style.display = 'none';
  document.querySelector('.sub').style.display = 'none';
  document.querySelector('.convite').style.display = 'none';
  aviso.style.display = 'block';
  document.querySelector('h1').style.display = 'none';
  document.querySelector('.data').style.display = 'none';
  aviso.className = dados.naoVao ? 'nao' : 'sim';
  aviso.innerHTML = dados.naoVao
    ? '<h3>Ahhh, que peninha! 🥺💗</h3><h4>Sentiremos sua falta!</h4><p>Mas tudo bem! Sabemos que nem sempre dá para participar de todas as aventuras. Mandaremos muitos beijinhos e esperaremos encontrar vocês em uma próxima missão! 🕷️✨</p>'
    : '<h3>Missão aceita! 🕷️💗</h3><h4>Sua equipe está confirmada!</h4><p>A Lara já está contando os dias para viver essa aventura com vocês! ✨</p>';
});
</script>
</body>
</html>
